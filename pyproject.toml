[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-travel"
version = "0.1.0"
description = "Voice Travel Agent - data layer and services"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "pydantic-settings>=2.2",
    "alembic>=1.13",
]

[project.optional-dependencies]
voice = ["fastapi>=0.110", "uvicorn>=0.29", "livekit-api>=1.0", "livekit>=1.0", "numpy>=1.26",
         "onnxruntime>=1.17", "faster-whisper>=1.0", "piper-tts>=1.3"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "fakeredis>=2.20"]

[project.scripts]
voice-api = "voice_travel.voice.api:main"
voice-worker = "voice_travel.voice.worker:main"
voice-echo-agent = "voice_travel.voice.dev_echo_agent:main"
fetch-voice-models = "voice_travel.voice.models:main"
seed-postgres = "voice_travel.seeding.postgres:main"
seed-redis = "voice_travel.seeding.redis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_travel = ["voice/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
