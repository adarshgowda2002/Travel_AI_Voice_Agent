# Local dev stack from the poster's data layer (section 6).
#   docker compose -f docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice_travel
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: voice
      MINIO_ROOT_PASSWORD: voicevoice
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    ports:
      - "7880:7880"                  # signalling (WebSocket/HTTP)
      - "7881:7881"                  # WebRTC over TCP (fallback)
      - "50000-50100:50000-50100/udp"  # WebRTC media
volumes:
  pgdata:
  qdrant:
  minio:
